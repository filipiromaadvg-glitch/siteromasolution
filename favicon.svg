<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ea580c"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c2410c"/>
      <stop offset="100%" style="stop-color:#ea580c"/>
    </linearGradient>
  </defs>

  <!-- Sombra / profundidade -->
  <rect x="3" y="5" width="58" height="58" rx="14" fill="rgba(0,0,0,0.35)" />

  <!-- Fundo principal com gradiente laranja -->
  <rect x="1" y="1" width="58" height="58" rx="14" fill="url(#bg)" />

  <!-- Borda interna sutil (brilho no topo) -->
  <rect x="1" y="1" width="58" height="30" rx="14" fill="rgba(255,255,255,0.08)" />

  <!-- Letras RS em branco, bold -->
  <text
    x="29"
    y="41"
    font-family="'Inter','Helvetica Neue',Arial,sans-serif"
    font-weight="900"
    font-size="28"
    letter-spacing="-1"
    fill="#ffffff"
    text-anchor="middle"
    dominant-baseline="auto"
  >RS</text>

  <!-- Linha decorativa embaixo das letras -->
  <rect x="16" y="44" width="26" height="2.5" rx="1.25" fill="rgba(255,255,255,0.35)" />
</svg>
